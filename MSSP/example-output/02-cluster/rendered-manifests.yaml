apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-portfolio-app-chroma
  labels:
    helm.sh/chart: portfolio-app-0.3.0
    app.kubernetes.io/name: portfolio-app
    app.kubernetes.io/instance: portfolio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-app
      app.kubernetes.io/instance: portfolio
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-app
        app.kubernetes.io/instance: portfolio
        app.kubernetes.io/component: chroma
    spec:
      serviceAccountName: portfolio-portfolio-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: "chromadb/chroma:1.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETUID
                - SETGID
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ANONYMIZED_TELEMETRY
              value: "False"
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: chroma-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: chroma-data
          persistentVolumeClaim:
            claimName: portfolio-portfolio-app-chroma
