# Gateway API — Namespace-scoped Gateway
# NIST 800-53: SC-7 (Boundary Protection), AC-6 (Least Privilege)
# Ref: GP-CONSULTING/02-CLUSTER-HARDENING/templates/gateway-api/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio-portfolio-app-gateway
  labels:
    helm.sh/chart: portfolio-app-0.3.0
    app.kubernetes.io/name: portfolio-app
    app.kubernetes.io/instance: portfolio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    control: SC-7
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "linksmlm.com"
      allowedRoutes:
        namespaces:
          from: Same    # AC-6: Only HTTPRoutes in this namespace
---
# Source: portfolio-app/templates/httproute.yaml
# API backend (/api/* → strips prefix → backend)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-portfolio-app-api
  labels:
    helm.sh/chart: portfolio-app-0.3.0
    app.kubernetes.io/name: portfolio-app
    app.kubernetes.io/instance: portfolio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
    control: SC-7
spec:
  parentRefs:
    - name: portfolio-portfolio-app-gateway
      sectionName: http
  hostnames:
    - "linksmlm.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: portfolio-portfolio-app-api
          port: 8000
