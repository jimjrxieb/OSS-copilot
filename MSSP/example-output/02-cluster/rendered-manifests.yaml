# Source: portfolio-app/templates/deployment-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-portfolio-app-api
  labels:
    helm.sh/chart: portfolio-app-0.3.0
    app.kubernetes.io/name: portfolio-app
    app.kubernetes.io/instance: portfolio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-app
      app.kubernetes.io/instance: portfolio
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-app
        app.kubernetes.io/instance: portfolio
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: portfolio-portfolio-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/jimjrxieb/portfolio-api:main-a4cbe744"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: CORS_ALLOW_ORIGINS
              value: "https://linksmlm.com"
            - name: DATA_DIR
              value: "/data"
            - name: LLM_MODEL
              value: "claude-3-haiku-20240307"
            - name: LLM_PROVIDER
              value: "claude"
            - name: RAG_NAMESPACE
              value: "portfolio"
            - name: CHROMA_HOST
              value: "portfolio-portfolio-app-chroma"
            - name: CHROMA_PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: portfolio-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portfolio-portfolio-app-data
        - name: tmp
          emptyDir: {}
