# helm-values-dev.yaml
# Dev environment Helm values template — hardened defaults.
# Copy to <client-repo>/helm/values-dev.yaml and customize.
#
# Generated by: GP-CONSULTING/01-APP-SEC/tools/deploy-dev.sh --generate-values
# Playbook:     GP-CONSULTING/01-APP-SEC/playbooks/15-deploy-dev.md

# ── Application ──────────────────────────────────────────────────────────────
replicaCount: 1

image:
  repository: your-registry.example.com/your-app
  tag: "dev-latest"
  pullPolicy: Always

imagePullSecrets: []
# - name: regcred

nameOverride: ""
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false    # Don't mount K8s API token unless the app needs it
  annotations: {}
  name: ""

# ── Security Context (Pod-level) ─────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# ── Security Context (Container-level) ───────────────────────────────────────
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Container ────────────────────────────────────────────────────────────────
containerPort: 8080

# ── Health Probes ────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

# ── Volumes (for readOnlyRootFilesystem) ─────────────────────────────────────
# Apps that write to /tmp or cache dirs need emptyDir mounts
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 100Mi
  - name: cache
    emptyDir:
      sizeLimit: 200Mi

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# ── Autoscaling ──────────────────────────────────────────────────────────────
autoscaling:
  enabled: false

# ── Node Scheduling ──────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Environment Variables ────────────────────────────────────────────────────
env:
  - name: APP_ENV
    value: "dev"
  - name: LOG_LEVEL
    value: "debug"

# Sensitive values — reference K8s secrets, never hardcode
envFrom: []
# - secretRef:
#     name: app-secrets
# - configMapRef:
#     name: app-config

# ── Pod Annotations ──────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  # Enable in dev if testing network segmentation:
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             name: dev
  # egress:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             name: dev
