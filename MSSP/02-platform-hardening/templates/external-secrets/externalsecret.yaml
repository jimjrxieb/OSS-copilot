# externalsecret.yaml — App team creates this to pull a secret from the backend
# NIST 800-53: SC-12, SC-28
#
# Dev references a secret by name. ESO syncs it into a K8s Secret automatically.
# Dev never sees the raw value. Rotation is transparent.
#
# Replace: <APP_NAME>, <NAMESPACE>, <SECRET_STORE_NAME>, <REMOTE_KEY>
# ─────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: <APP_NAME>-secrets
  namespace: <NAMESPACE>
  labels:
    app: <APP_NAME>
    app.kubernetes.io/managed-by: gp-copilot
    control: SC-12
spec:
  refreshInterval: 1h                         # How often to sync from backend
  secretStoreRef:
    name: <SECRET_STORE_NAME>                  # e.g. aws-secrets-manager, vault
    kind: ClusterSecretStore                   # or SecretStore for namespace-scoped

  target:
    name: <APP_NAME>-secrets                   # K8s Secret name created by ESO
    creationPolicy: Owner                      # ESO owns lifecycle — deleting ExternalSecret deletes K8s Secret

  data:
    # Map each remote secret key to a K8s Secret key
    - secretKey: DB_PASSWORD                   # Key in K8s Secret
      remoteRef:
        key: <REMOTE_KEY>                      # Key in backend (e.g. prod/myapp/db-password)
        # property: password                   # Uncomment for JSON secrets (extract specific field)

    # Add more keys as needed:
    # - secretKey: API_KEY
    #   remoteRef:
    #     key: prod/myapp/api-key

---
# Usage in Deployment:
#
# env:
#   - name: DB_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: <APP_NAME>-secrets
#         key: DB_PASSWORD
#
# Or mount as volume:
#
# volumes:
#   - name: secrets
#     secret:
#       secretName: <APP_NAME>-secrets
