# secretstore-namespace.yaml — Namespace-scoped SecretStore
# NIST 800-53: AC-6 (Least Privilege), SC-12
#
# Use this when different namespaces need different backends or access scopes.
# More restrictive than ClusterSecretStore — only ExternalSecrets in the same
# namespace can reference it.
#
# Replace: <NAMESPACE>, <AWS_REGION> or <VAULT_ADDR>
# ─────────────────────────────────────────────────────────────────

---
# AWS Secrets Manager (namespace-scoped)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/managed-by: gp-copilot
    control: SC-12
spec:
  provider:
    aws:
      service: SecretsManager
      region: <AWS_REGION>
      auth:
        jwt:
          serviceAccountRef:
            name: <NAMESPACE>-eso-sa           # Namespace-specific SA with IRSA

