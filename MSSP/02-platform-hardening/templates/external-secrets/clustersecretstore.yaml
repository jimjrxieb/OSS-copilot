# clustersecretstore.yaml — Cluster-wide secret backend (platform team owns)
# NIST 800-53: SC-12 (Cryptographic Key Establishment), SC-28 (Protection of Information at Rest)
#
# ClusterSecretStore is cluster-scoped — any namespace can reference it.
# Platform team deploys this ONCE. App teams create ExternalSecrets that reference it.
#
# Choose ONE backend below. Uncomment and configure.
# ─────────────────────────────────────────────────────────────────

---
# AWS Secrets Manager (uses IRSA — no hardcoded credentials)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/managed-by: gp-copilot
    control: SC-12
spec:
  provider:
    aws:
      service: SecretsManager
      region: <AWS_REGION>                    # e.g. us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets        # ESO's namespace

