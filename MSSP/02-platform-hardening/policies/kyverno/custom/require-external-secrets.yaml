apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-external-secrets
  annotations:
    policies.kyverno.io/title: Require External Secrets Operator
    policies.kyverno.io/category: Secrets Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Deny creation of native Kubernetes Secrets of type Opaque in
      non-system namespaces. Teams must use ExternalSecret resources
      to sync secrets from an external store (Vault, AWS SM, Azure KV).
      This ensures secrets are never stored in Git and rotation is
      managed centrally. Enforces SC-12 (Cryptographic Key Establishment).
    nist-800-53: SC-12
    gp-copilot/category: "custom"
    gp-copilot/standard: "GP-Copilot"
    gp-copilot/value-add: "true"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-native-opaque-secrets
      match:
        any:
          - resources:
              kinds:
                - Secret
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - external-secrets
                - cert-manager
                - gatekeeper-system
                - falco
                - gp-security
                - argocd
          - resources:
              kinds:
                - Secret
              selector:
                matchLabels:
                  # Allow ESO-managed secrets through
                  reconcile.external-secrets.io/created-by: "*"
      validate:
        message: >-
          Native Kubernetes Secrets of type Opaque are not allowed in
          application namespaces. Use an ExternalSecret resource to sync
          secrets from your external store. See 03-templates/external-secrets/
          for examples.
        pattern:
          type: "!Opaque"
