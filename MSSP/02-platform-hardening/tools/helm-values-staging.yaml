# helm-values-staging.yaml
# Staging environment Helm values template — production-class security defaults.
# Staging mirrors prod: same security context, same resource class, same admission policies.
# Only replicas and ingress differ.
#
# Copy to <client-repo>/helm/values-staging.yaml and customize.
#
# Generated by: GP-CONSULTING/02-CLUSTER-HARDEN/tools/deploy-stage.sh --generate-values
# Playbook:     GP-CONSULTING/02-CLUSTER-HARDEN/playbooks/20-deploy-stage.md

# ── Application ──────────────────────────────────────────────────────────────
replicaCount: 2

image:
  repository: your-registry.example.com/your-app
  tag: "v1.0.0"   # Promoted from dev — never :latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: regcred

nameOverride: ""
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# ── Security Context (Pod-level) — MUST match prod ──────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# ── Security Context (Container-level) — MUST match prod ────────────────────
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ── Resources (Prod class — same as production) ─────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Container ────────────────────────────────────────────────────────────────
containerPort: 8080

# ── Health Probes ────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

# ── Volumes (for readOnlyRootFilesystem) ─────────────────────────────────────
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 100Mi
  - name: cache
    emptyDir:
      sizeLimit: 200Mi

# ── Ingress (enabled in staging — test before prod) ─────────────────────────
ingress:
  enabled: true
  className: ""
  annotations:
    # Uncomment for nginx:
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: staging.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: staging-tls
  #   hosts:
  #     - staging.example.internal

# ── Autoscaling (disabled in staging — test manually) ────────────────────────
autoscaling:
  enabled: false
  # Prod values for reference:
  # minReplicas: 2
  # maxReplicas: 10
  # targetCPUUtilizationPercentage: 70

# ── Network Policy (enabled — staging must test segmentation) ────────────────
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: staging
      ports:
        - port: 8080
          protocol: TCP
    # Allow ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Same-namespace traffic
    - to:
        - podSelector: {}

# ── Node Scheduling ──────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
  # Prefer spreading across nodes (staging validates HA)
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #             - key: app.kubernetes.io/name
  #               operator: In
  #               values: [your-app]
  #         topologyKey: kubernetes.io/hostname

# ── Environment Variables ────────────────────────────────────────────────────
env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"

envFrom: []
# - secretRef:
#     name: app-secrets-staging
# - configMapRef:
#     name: app-config-staging

# ── Pod Annotations ──────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
